<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    
    
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="login-card" aria-label="Login form">
        <button class="close-button" type="button" aria-label="Close dialog">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>

        <h1>Login Form</h1>
        <form class="login-form" action="">
          <label for="identity">Email or Phone</label>
          <input id="identity" type="text" required />

          <label for="password">Password</label>
          <input id="password" type="password" required />

          <a class="forgot-link" href="#">Forgot Password?</a>

          <button type="submit" class="login-button">LOGIN</button>

          <p class="signup-text">Not a member? <a href="#">Signup now</a></p>
        </form>
      </section>
    </main>
  </body>
</html>
